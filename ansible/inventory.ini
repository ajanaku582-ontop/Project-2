; [bastion]
; <BASTION_IP> ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/ec2.pem

; [app]
; <APP_PRIVATE_IP> ansible_user=ec2-user ansible_ssh_private_key_file=~/.ssh/ec2.pem ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p -i ~/.ssh/ec2.pem ec2-user@<BASTION_IP>"'

[bastion]
bastion ansible_host=3.145.74.138 ansible_user=ubuntu

[app]
app ansible_host=10.0.10.98 ansible_user=ubuntu \
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p ubuntu@3.145.74.138"'

[postgres]
postgres ansible_host=10.0.20.50 ansible_user=ubuntu \
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p ubuntu@3.145.74.138"'