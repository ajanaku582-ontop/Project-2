; [nginx]
; {{ nginx_private_ip }}

; [app]
; {{ app_private_ip }}

; [all:vars]
; ansible_user=ec2-user
; ansible_ssh_private_key_file=~/.ssh/mykey.pem

resource "local_file" "inventory" {
  content = <<EOF
[nginx]
${aws_instance.nginx.public_ip}

[app]
${aws_instance.app.private_ip}

[all:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=${var.key_path}
EOF

  filename = "${path.module}/ansible/inventory.ini"
}