- name: Configure Nginx
  hosts: nginx
  become: yes
  tasks:
    - name: Replace APP_IP in nginx.conf
      template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf

    - name: Copy index.html
      copy:
        src: index.html
        dest: /usr/share/nginx/html/index.html

    - name: Install nginx
      yum:
        name: nginx
        state: present

    - name: Start nginx
      service:
        name: nginx
        state: started
        enabled: yes