---
- name: Install Nginx
  hosts: bastion
  become: true
  tasks:
    - name: Install Nginx
      apt:
        update_cache: yes
        name: 
            - nginx
            - git
            - curl
            - tree
        state: present

    - name: Start Nginx
      service:
        name: nginx
        state: started
        enabled: yes
               
    - name: Verify Nginx is running
      service:  
        name: nginx
        state: started
        enabled: yes
      register: nginx_status
    - name: Print Nginx status
      debug:
        msg: "Nginx status: {{ nginx_status }}"
    - name: Install Nginx and setup landing page
      shell: |
                # Create custom landing page
                sudo mkdir -p /var/www/html/custom
                sudo echo "<h1>Welcome to Custom Nginx Page</h1>" > /var/www/html/custom/index.html
                
                # Start Nginx
                sudo systemctl daemon-reload
                sudo systemctl start nginx
                sudo systemctl enable nginx

                # Check if Nginx is running
                sudo systemctl status nginx
                
                echo "Nginx installation completed!"

- name: Install app
  hosts: app
  become: true

  tasks:

    - name: Install Python
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: yes

    - name: Create virtual environment
      command: python3 -m venv /opt/venv

    - name: Install Flask
      pip:
        name: flask
        virtualenv: /opt/venv
    
    - name: Install Python dependencies
      pip:
      requirements: /opt/app/requirements.txt
      virtualenv: /opt/appenv